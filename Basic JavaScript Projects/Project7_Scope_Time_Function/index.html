<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Local and Global Variables</title>
        <meta charset="UTF-8">
        <script src="js/main.js" defer></script>
    </head>
    <body>
        <p id="click" onclick="myFunc()">Click me!</p>
        <p id="hour" onclick="getHour()">Click me for the current hour of the day!</p>
        <br>
        <p>Write your age:</p>
        <input id="age" value="">
        <p id="is_adult"></p>
        <button onclick="isAdult()">Submit</button>
        <br>
        <br>
        <br>
        <button onclick="whatSeason()">Click here for the current season of the year!</button>
        <p id="season"></p>
    </body>
</html>
