<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Pizza Drill Demo</title>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <meta content="width=device-width,initial-scale=1.0" name="viewport">
        <script src="Pizza_JavaScript/Pizza.js" defer></script>
        <link rel="stylesheet" href="Pizza_CSS/Pizza.css">
    </head>
    <body>
        <div id="menuBG">
            <h1 style="margin: 0 0px 0 20px;">Pizza Drill Tutorial</h1>
            <input id="btnOrder" type="button" onclick="getReceipt()"
                value="Place Order">
            <form id="frmMenu">
                <div class="menu-category">
                    <h3>Size:</h3>
                    <div class="input-group">
                        <div class="option-row">
                            <input class="size" id="size1" type="radio" name="Size"
                                value="Personal Pizza">
                            <label for="size1">Personal Pizza</label>
                        </div>
                        <div class="option-row">
                            <input class="size" id="size2" type="radio" name="Size"
                                value="Medium Pizza">
                            <label for="size2">Medium Pizza</label>
                        </div>
                        <div class="option-row">
                            <input class="size" id="size3" type="radio" name="Size"
                                value="Large Pizza">
                            <label for="size3">Large Pizza</label>
                        </div>
                        <div class="option-row">
                            <input class="size" id="size4" type="radio" name="Size"
                                value="Extra Large Pizza">
                            <label for="size4">Extra Large Pizza</label>
                        </div>
                        <div class="option-row">
                            <input class="size" id="size5" type="radio" name="Size"
                                value="Party Pizza">
                            <label for="size5">Party Pizza</label>
                        </div>
                    </div>
                </div>
                <div class="menu-category">
                    <h3>Meats:</h3>
                    <div class="input-group">
                        <div class="option-row">
                            <input class="toppings" id="top1" type="checkbox" name="Topping"
                                value="Pepperoni">
                            <label for="top1">Pepperoni</label>
                        </div>
                        <div class="option-row">
                            <input class="toppings" id="top2" type="checkbox" name="Topping"
                                value="Sausage">
                            <label for="top2">Sausage</label>
                        </div>
                        <div class="option-row">
                            <input class="toppings" id="top3" type="checkbox" name="Topping"
                                value="Canadian Bacon">
                            <label for="top3">Canadian Bacon</label>
                        </div>
                        <div class="option-row">
                            <input class="toppings" id="top4" type="checkbox" name="Topping"
                                value="Ground Beef">
                            <label for="top4">Ground Beef</label>
                        </div>
                        <div class="option-row">
                            <input class="toppings" id="top5" type="checkbox" name="Topping"
                                value="Anchovy">
                            <label for="top5">Anchovy</label>
                        </div>
                        <div class="option-row">
                            <input class="toppings" id="top6" type="checkbox" name="Topping"
                                value="Chicken">
                            <label for="top6">Chicken</label>
                        </div>
                        <div class="option-row">
                            <input class="toppings" id="top7" type="checkbox" name="Topping"
                                value="Salami">
                            <label for="top7">Salami</label>
                        </div>
                    </div>
                </div>
                <div class="menu-category">
                    <h3>Vegetables:</h3>
                    <div class="input-group">
                        <div class="option-row">
                            <input class="vegetables" id="veg1" type="checkbox" name="Vegetable"
                                value="Mushrooms">
                            <label for="veg1">Mushrooms</label>
                        </div>
                        <div class="option-row">
                            <input class="vegetables" id="veg2" type="checkbox" name="Vegetable"
                                value="Onions">
                            <label for="veg2">Onions</label>
                        </div>
                        <div class="option-row">
                            <input class="vegetables" id="veg3" type="checkbox" name="Vegetable"
                                value="Tomatoes">
                            <label for="veg3">Tomatoes</label>
                        </div>
                        <div class="option-row">
                            <input class="vegetables" id="veg4" type="checkbox" name="Vegetable"
                                value="Olives">
                            <label for="veg4">Olives</label>
                        </div>
                        <div class="option-row">
                            <input class="vegetables" id="veg5" type="checkbox" name="Vegetable"
                                value="Green Peppers">
                            <label for="veg5">Green Peppers</label>                                               
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div id="cart">
            <div id="showText"></div>
            <div id="totalPrice"></div>
        </div>
    </body>
</html>
